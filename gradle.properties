org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
dev.kikugie.stonecutter.hard_mode=true
# Loom 1.18.4 needs a Java 25 JVM to configure, while the pre-26 targets still compile
# against 21, so both JDKs have to be visible. On CI they come from setup-java; locally
# these variables do not exist and Gradle falls back to its own detection.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

mod_version=2.0.0
maven_group=land.webgui
archives_base_name=webgui

# Publishing. Modrinth id is hard-coded in the release workflow.
# CurseForge publishing activates when the CURSEFORGE_ID repo variable and the
# CURSEFORGE_TOKEN repo secret are set (Settings → Secrets and variables → Actions).
MODRINTH_PROJECT_ID=tDw1xQja
