pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(rootProject) {
        // MC 26, both loaders. The game is unobfuscated from 26.1, so Fabric here builds
        // with a different Loom plugin than the versions below — see the plugins block in
        // build.gradle. One Gradle build still covers both eras.
        // 26.3 is Mojang's newest stable. NeoForge has only a beta on that line, so the
        // release workflow publishes both 26.3 targets as beta rather than release.
        version '26.3-neoforge',    '26.3-neoforge'
        version '26.3-fabric',      '26.3-fabric'
        version '26.2-neoforge',    '26.2-neoforge'
        version '26.2-fabric',      '26.2-fabric'
        version '26.1.2-neoforge',  '26.1.2-neoforge'
        version '1.21.11-fabric',   '1.21.11-fabric'
        version '1.21.11-neoforge', '1.21.11-neoforge'
        version '1.21.1-fabric',    '1.21.1-fabric'
        version '1.21.1-neoforge',  '1.21.1-neoforge'
        version '1.20.1-fabric',    '1.20.1-fabric'
        // 1.20.1-neoforge: net.neoforged.moddev 2.x targets NeoForge 1.20.4+
        vcsVersion = '1.21.11-fabric'
    }
}

rootProject.name = 'webgui'
