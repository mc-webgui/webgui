modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/mc-webgui/webgui/issues"

[[mods]]
modId = "webgui"
version = "${version}"
displayName = "WebGUI"
authors = "KoSHeroff"
displayURL = "https://webgui.space"
logoFile = "icon-256.png"
credits = "Chromium embedding based on java-cef (Chromium Embedded Framework)"
description = "Web-based GUI framework for Minecraft — open any web page as a full-screen GUI or HUD overlay."

[[dependencies.webgui]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.webgui]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "webgui.mixins.json"
