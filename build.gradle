plugins {
    // Two Loom plugins, one artifact and one version. Minecraft 26.1 ships unobfuscated, so
    // there is nothing left to remap and no mapping file to ask for; the older versions still
    // need both. Fabric splits that into two plugin ids rather than one plugin with a switch,
    // and because they are the same artifact they sit on the build classpath together —
    // which is what makes one Gradle build able to cover both eras at all.
    id 'net.fabricmc.fabric-loom-remap' version '1.18.4' apply false
    id 'net.fabricmc.fabric-loom'       version '1.18.4' apply false
    id 'net.neoforged.moddev' version '2.0.+' apply false
    id 'maven-publish'
}

// Whether this Minecraft ships unobfuscated. Set in the version's own gradle.properties, not
// worked out from the number: the line is where Mojang drew it, not where a comparison would.
def unobfuscated = project.findProperty('unobfuscated') == 'true' 

// Version-specific properties are loaded automatically by Stonecutter
// from versions/{active}/gradle.properties.
version = "${mod_version}+mc${minecraft_version}"
group   = maven_group

def sc_loader = stonecutter.current.version.contains("neoforge") ? "neoforge" : "fabric"

stonecutter.constants {
    put "fabric", (sc_loader == "fabric")
}

// Both loaders are on Mojang mappings now, so this is no longer loader-specific.
stonecutter.swaps {
    put "currentScreen", "screen"
}

base {
    // Include the loader so Fabric and NeoForge jars for the same MC version
    // don't share a filename — otherwise flat release assets overwrite each
    // other and only one loader survives.
    archivesName = "${archives_base_name}-${sc_loader}"
}

// Apply the loader-specific plugin after the stonecutter constants are set
if (sc_loader == "fabric") {
    apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
} else {
    apply plugin: 'net.neoforged.moddev'
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    if (sc_loader != "fabric") {
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

if (sc_loader == "fabric") {
    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        if (unobfuscated) {
            // No mappings at all, and nothing is remapped: from 26.1 the game carries its own
            // names and its parameter names with it. A dependency needs no `mod` prefix for
            // the same reason — there is nothing to translate on the way in.
            implementation "net.fabricmc:fabric-loader:${loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
            compileOnly("maven.modrinth:modmenu:${modmenu_version}")
        } else {
            // Mojang's own, not Yarn. Yarn stopped at 1.21.11 and is no longer supported by
            // Fabric, which tells mods to move before going near Minecraft 26 — so both
            // loaders now speak the same names and this mod has one set, not two.
            mappings loom.officialMojangMappings()
            modImplementation "net.fabricmc:fabric-loader:${loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
            // Compiled against, never shipped and never required: it is only needed to
            // implement the entrypoint that puts a Config button in its list.
            modCompileOnly("maven.modrinth:modmenu:${modmenu_version}")
        }
    }
} else {
    neoForge {
        version = project.neoforge_version
        // Register the mod so moddev's JUnit runtime can load it during tests.
        mods {
            webgui {
                sourceSet sourceSets.main
            }
        }
        // Boots FML + constructs the mod inside the `test` task (NeoForge's
        // equivalent of fabric-loader-junit), so the launch test runs here.
        unitTest {
            enable()
            testedMod = mods.webgui
        }
        // Dev run configs (parity with loom's runClient/runServer on Fabric).
        runs {
            client {
                client()
            }
            server {
                server()
            }
        }
    }
}

// --- The browser ---
//
// Chromium is ours now: there is no browser mod to install beside this one, and nothing
// here depends on one. What is needed at build time is the java-cef Java classes — a couple
// of hundred kilobytes of JNI declarations — and they are baked into the jar below rather
// than shipped as a library of their own.
//
// Nothing is relocated on the way in. The native side binds to these classes by name, so
// `org.cef.Foo` moved to `land.webgui.shadow.org.cef.Foo` links against nothing at the first
// JNI call. It also has to land in the same jar as our own `org.cef.browser.OffscreenBrowser`,
// which reaches package-private state upstream never exposed: split across two jars, NeoForge's
// module layer refuses the package outright.
//
// The version must stay equal to NativeBundles.JCEF_VERSION — the classes are the JNI
// declarations for the libraries in that exact bundle, and a mismatch is a missing symbol at
// the first call rather than an error here. WmcNativeBundlesTest asserts the two agree.
def jcefVersion = 'jcef-ca49ada+cef-135.0.20+ge7de5c3+chromium-135.0.7049.85'

configurations {
    jcef
    // Compiled against, never handed to the loader as a library: the classes are unpacked
    // into this mod's own output below, so they are part of it everywhere.
    compileOnly.extendsFrom jcef
}

dependencies {
    // Its OpenGL dependencies exist for the AWT-canvas browser upstream provides, which is
    // the one thing a Minecraft integration can never use: ten megabytes for a class that is
    // never loaded.
    jcef("me.friwi:jcef-api:${jcefVersion}") {
        exclude group: 'me.friwi', module: 'jogl-all'
        exclude group: 'me.friwi', module: 'gluegen-rt'
    }
}

// Unpacked into this mod's own class output rather than kept as a library beside it.
//
// One mechanism covering three places at once: the jar gets the classes, a dev run gets them,
// and — the reason it has to be this way — NeoForge puts every mod in a JPMS module, where a
// package may live in only one. Our own org.cef.browser.OffscreenBrowser reaches
// package-private state upstream never exposed, so it must sit in that package; with
// jcef-api beside the mod as a module of its own, the game refuses to start:
//
//   Module webgui contains package org.cef.browser, module jcef.api... exports package
//   org.cef.browser to webgui
//
// Fabric's flat class loader does not care, which is why this only showed up on the other
// loader, three targets in.
def unpackJcef = tasks.register('unpackJcef', Copy) {
    from({ configurations.jcef.collect { zipTree(it) } }) {
        // Upstream's own metadata, which says nothing about this mod: an index that is now
        // wrong, signatures that no longer match, and a module declaration that would put
        // these classes straight back into a module of their own.
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'module-info.class'
        // Kept, and renamed so it does not sit on top of ours: java-cef is BSD-3-Clause and
        // its terms travel with the bytes.
        rename(~/^LICENSE\.txt$/, 'META-INF/licenses/jcef-LICENSE.txt')
        rename(~/^README\.txt$/, 'META-INF/licenses/jcef-README.txt')
    }
    into layout.buildDirectory.dir('jcef-classes')
}

sourceSets.main.output.dir(layout.buildDirectory.dir('jcef-classes'), builtBy: unpackJcef)

// --- Testing ---
dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Test-only, and deliberately: the tar reader is checked against archives a real tar
    // writer produced, not against ones written by the same code that reads them. Nothing
    // of this reaches the jar.
    // Pinned old and kept non-transitive on purpose. Only the tar writer is wanted, and
    // newer releases drag in commons-io and commons-codec at versions Minecraft pins
    // strictly to older ones — which resolves to nothing at all on NeoForge 1.21.1.
    testImplementation("org.apache.commons:commons-compress:1.21") { transitive = false }
    if (sc_loader == "fabric") {
        // Bootstraps Minecraft + the Fabric loader inside JUnit so the launch
        // smoke test (@Tag("launch")) can assert the mod actually loads.
        // Runtime-only: it never affects compilation of the shared test sources.
        testRuntimeOnly "net.fabricmc:fabric-loader-junit:${loader_version}"
    }
}

test {
    // So a test can insist the Java classes and the pinned bundle name the same build.
    systemProperty 'wmc.jcefVersion', jcefVersion
    useJUnitPlatform {
        if (sc_loader == "fabric") {
            // Fabric runs the launch test in the separate `launchTest` task so
            // the default `build` stays fast and doesn't need game assets.
            excludeTags 'launch'
        }
        // NeoForge: moddev's unitTest boots FML in this task, so the launch test
        // runs here; the 'loader'-tagged config tests also work under that boot.
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Boots Minecraft with the mod and asserts it loads. CI runs this on Fabric:
//   ./gradlew launchTest
tasks.register('launchTest', Test) {
    group       = 'verification'
    description = 'Boots Minecraft with the mod (fabric-loader-junit) and asserts it loads.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath       = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'launch'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// By number, so that "26.3" sorts after "1.21.11" rather than before it.
static boolean atLeast(String version, String floor) {
    def have = version.tokenize('.').collect { it.toInteger() }
    def want = floor.tokenize('.').collect { it.toInteger() }
    for (int i = 0; i < Math.max(have.size(), want.size()); i++) {
        int a = i < have.size() ? have[i] : 0
        int b = i < want.size() ? want[i] : 0
        if (a != b) {
            return a > b
        }
    }
    return true
}

processResources {
    inputs.property 'version',         project.version
    inputs.property 'minecraft_range', project.minecraft_range
    // Declared, or the rename below is invisible to the up-to-date check.
    inputs.property 'iconKey',         atLeast(project.minecraft_version, '26.3')
    if (sc_loader == "fabric") {
        // Don't ship NeoForge metadata in the Fabric jar, or loaders/Modrinth
        // mis-detect it as a NeoForge mod too.
        exclude 'META-INF/neoforge.mods.toml'
        filesMatching('fabric.mod.json') {
            expand version: project.version, minecraft_range: project.minecraft_range
        }
    } else {
        // Likewise, keep Fabric metadata out of the NeoForge jar. The death-screen
        // mixin goes with it: NeoForge replaces the screen through ScreenEvent
        // instead, so applying the mixin there would swap the screen twice.
        exclude 'fabric.mod.json'
        exclude 'webgui.fabric.mixins.json'
        filesMatching('META-INF/neoforge.mods.toml') {
            expand version: project.version, minecraft_range: project.minecraft_range
            // NeoForge renamed logoFile to iconFile in 26.3 and warns about the old name.
            // Renamed here, since earlier versions still need the file as it is.
            if (atLeast(project.minecraft_version, '26.3')) {
                filter { line -> line.replaceFirst(/^logoFile(\s*)=/, 'iconFile$1=') }
            }
        }
        filesMatching('pack.mcmeta') { expand version: project.version }
    }
}


tasks.register('bumpPatch') {
    group       = 'versioning'
    description = 'Increments mod_version patch in gradle.properties'
    doLast {
        def f = rootProject.file('gradle.properties')
        def lines = f.readLines('UTF-8')
        def newLines = []
        def bumped = false
        lines.each { line ->
            if (line.startsWith('mod_version=')) {
                def oldV  = line.substring('mod_version='.length()).trim()
                def parts = oldV.split('\\.')
                if (parts.length < 3) throw new GradleException("mod_version must be semver x.y.z, got: $oldV")
                def p = parts[2].replaceAll(/[^0-9].*$/, '')
                if (!p) throw new GradleException("bad patch in mod_version: $oldV")
                def newV = "${parts[0]}.${parts[1]}.${p.toInteger() + 1}"
                newLines.add("mod_version=${newV}")
                bumped = true
                println "[bumpPatch] ${oldV} -> ${newV}"
            } else {
                newLines.add(line)
            }
        }
        if (!bumped) throw new GradleException("mod_version= not found in gradle.properties")
        f.write(newLines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
}

// Java version tracks the Minecraft version: 21 for 1.20/1.21, 25 for MC 26+.
def javaVersion = (project.findProperty('java_version') ?: '21').toString().toInteger()

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xmaxerrs' << '3000'
    it.options.release  = javaVersion
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}
