plugins {
    id 'fabric-loom'       version '1.16.+' apply false
    id 'net.neoforged.moddev' version '2.0.+' apply false
    id 'maven-publish'
}

// Version-specific properties are loaded automatically by Stonecutter
// from versions/{active}/gradle.properties.
version = "${mod_version}+mc${minecraft_version}"
group   = maven_group

def sc_loader = stonecutter.current.version.contains("neoforge") ? "neoforge" : "fabric"

stonecutter.constants {
    put "fabric", (sc_loader == "fabric")
}

// NeoForge uses Mojang mappings: currentScreen → screen
if (sc_loader != "fabric") {
    stonecutter.swaps {
        put "currentScreen", "screen"
    }
}

base {
    // Include the loader so Fabric and NeoForge jars for the same MC version
    // don't share a filename — otherwise flat release assets overwrite each
    // other and only one loader survives.
    archivesName = "${archives_base_name}-${sc_loader}"
}

// Apply the loader-specific plugin after the stonecutter constants are set
if (sc_loader == "fabric") {
    apply plugin: 'fabric-loom'
} else {
    apply plugin: 'net.neoforged.moddev'
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    if (sc_loader != "fabric") {
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

if (sc_loader == "fabric") {
    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings  "net.fabricmc:yarn:${yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
        include(modImplementation("maven.modrinth:rinku:${rinku_version}"))
        // Compiled against, never shipped and never required: it is only needed to
        // implement the entrypoint that puts a Config button in its list.
        modCompileOnly("maven.modrinth:modmenu:${modmenu_version}")
    }
} else {
    configurations {
        rinkuArtifact
    }

    // Rinku is a client-side library, and NeoForge's dev dist cleaner strips
    // the client classes it constructs against. A plain `runtimeOnly` feeds
    // BOTH dev runs, so runServer used to die during mod loading with
    // NoClassDefFoundError on Screen — on every Minecraft 26 build, and never
    // caught because 26.x had no server smoke test. moddev's per-run classpath
    // is gone on modern Minecraft ("no additional classpath anymore"), so scope
    // it by installing the jar into the client run's mods folder instead. That
    // also mirrors production, where a server operator simply never installs
    // Rinku and WebGUI never declares it as a dependency.
    def installRinkuForClientRun = tasks.register('installRinkuForClientRun', Copy) {
        from configurations.rinkuArtifact
        into layout.projectDirectory.dir('run/mods')
    }

    def removeRinkuForServerRun = tasks.register('removeRinkuForServerRun', Delete) {
        delete fileTree(layout.projectDirectory.dir('run/mods')) { include 'rinku*.jar' }
    }

    neoForge {
        version = project.neoforge_version
        // Register the mod so moddev's JUnit runtime can load it during tests.
        mods {
            webgui {
                sourceSet sourceSets.main
            }
        }
        // Boots FML + constructs the mod inside the `test` task (NeoForge's
        // equivalent of fabric-loader-junit), so the launch test runs here.
        unitTest {
            enable()
            testedMod = mods.webgui
        }
        // Dev run configs (parity with loom's runClient/runServer on Fabric).
        runs {
            client {
                client()
                // Rinku reaches the client the way a player installs it: as a
                // jar in the mods folder, not on the runtime classpath. Keeping
                // it off the classpath is what keeps runServer alive — see the
                // installRinkuForClientRun task below.
                taskBefore(installRinkuForClientRun)
            }
            server {
                server()
                // Both dev runs share versions/<target>/run, so the jar dropped in
                // for the client is also visible to the server — which is exactly
                // what kills it. Take it back out before the server starts.
                taskBefore(removeRinkuForServerRun)
            }
        }
    }


    // Rinku ships its NeoForge builds inconsistently: 26.2 has classes at the
    // top level, but 1.21.1 and 26.1.2 are jarJar wrappers whose real mod sits
    // in META-INF/jarjar/. NeoForge unpacks that at runtime, so the game is
    // happy either way — javac is not, and sees an empty jar. Compile against
    // whatever actually holds the classes; the published artifact stays on the
    // runtime classpath untouched.
    dependencies {
        rinkuArtifact "maven.modrinth:rinku:${rinku_version}"
    }

    def rinkuClassesDir = layout.buildDirectory.dir('rinku-compile')
    def unwrapRinku = tasks.register('unwrapRinku') {
        def artifact = configurations.rinkuArtifact
        inputs.files(artifact)
        outputs.dir(rinkuClassesDir)
        doLast {
            def dir = rinkuClassesDir.get().asFile
            dir.deleteDir()
            dir.mkdirs()
            def outer = artifact.singleFile
            def target = new File(dir, 'rinku.jar')
            new java.util.zip.ZipFile(outer).withCloseable { zip ->
                def nested = zip.entries().toList().find {
                    it.name.startsWith('META-INF/jarjar/') && it.name.endsWith('.jar')
                }
                if (nested != null) {
                    target.withOutputStream { out -> out << zip.getInputStream(nested) }
                    logger.lifecycle("rinku: compiling against nested ${nested.name}")
                } else {
                    target.bytes = outer.bytes
                }
            }
        }
    }

    dependencies {
        // Point at the jar itself, not the directory holding it — a directory
        // on the compile classpath is searched for loose .class files only.
        compileOnly files(rinkuClassesDir.map { it.file('rinku.jar') }) {
            builtBy unwrapRinku
        }
    }
}

// --- Testing ---
dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    if (sc_loader == "fabric") {
        // Bootstraps Minecraft + the Fabric loader inside JUnit so the launch
        // smoke test (@Tag("launch")) can assert the mod actually loads.
        // Runtime-only: it never affects compilation of the shared test sources.
        testRuntimeOnly "net.fabricmc:fabric-loader-junit:${loader_version}"
    }
}

test {
    useJUnitPlatform {
        if (sc_loader == "fabric") {
            // Fabric runs the launch test in the separate `launchTest` task so
            // the default `build` stays fast and doesn't need game assets.
            excludeTags 'launch'
        }
        // NeoForge: moddev's unitTest boots FML in this task, so the launch test
        // runs here; the 'loader'-tagged config tests also work under that boot.
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Boots Minecraft with the mod and asserts it loads. CI runs this on Fabric:
//   ./gradlew launchTest
tasks.register('launchTest', Test) {
    group       = 'verification'
    description = 'Boots Minecraft with the mod (fabric-loader-junit) and asserts it loads.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath       = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'launch'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

processResources {
    inputs.property 'version',         project.version
    inputs.property 'minecraft_range', project.minecraft_range
    if (sc_loader == "fabric") {
        // Don't ship NeoForge metadata in the Fabric jar, or loaders/Modrinth
        // mis-detect it as a NeoForge mod too.
        exclude 'META-INF/neoforge.mods.toml'
        filesMatching('fabric.mod.json') {
            expand version: project.version, minecraft_range: project.minecraft_range
        }
    } else {
        // Likewise, keep Fabric metadata out of the NeoForge jar. The death-screen
        // mixin goes with it: NeoForge replaces the screen through ScreenEvent
        // instead, and the mixin targets Yarn's MinecraftClient, which does not
        // exist under Mojang mappings.
        exclude 'fabric.mod.json'
        exclude 'webgui.fabric.mixins.json'
        filesMatching('META-INF/neoforge.mods.toml') {
            expand version: project.version, minecraft_range: project.minecraft_range
        }
        filesMatching('pack.mcmeta') { expand version: project.version }
    }
}


tasks.register('bumpPatch') {
    group       = 'versioning'
    description = 'Increments mod_version patch in gradle.properties'
    doLast {
        def f = rootProject.file('gradle.properties')
        def lines = f.readLines('UTF-8')
        def newLines = []
        def bumped = false
        lines.each { line ->
            if (line.startsWith('mod_version=')) {
                def oldV  = line.substring('mod_version='.length()).trim()
                def parts = oldV.split('\\.')
                if (parts.length < 3) throw new GradleException("mod_version must be semver x.y.z, got: $oldV")
                def p = parts[2].replaceAll(/[^0-9].*$/, '')
                if (!p) throw new GradleException("bad patch in mod_version: $oldV")
                def newV = "${parts[0]}.${parts[1]}.${p.toInteger() + 1}"
                newLines.add("mod_version=${newV}")
                bumped = true
                println "[bumpPatch] ${oldV} -> ${newV}"
            } else {
                newLines.add(line)
            }
        }
        if (!bumped) throw new GradleException("mod_version= not found in gradle.properties")
        f.write(newLines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
}

// Java version tracks the Minecraft version: 21 for 1.20/1.21, 25 for MC 26+.
def javaVersion = (project.findProperty('java_version') ?: '21').toString().toInteger()

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release  = javaVersion
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}
